[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-bot"
version = "0.1.0"
description = "Buscador de ofertas backend con alertas de Telegram y generacion de cover letters"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Only needed for `jobbot login` and for the Otta source. The rest of the bot
# works without it. After installing: playwright install chromium
browser = ["playwright>=1.44"]

[project.scripts]
jobbot = "jobbot.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
# The same width as ruff: two formatters with different rules reformat each
# other's code on every commit.
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares options in the default values: that is how it is meant to be used.
"src/jobbot/cli.py" = ["B008"]
# The fixtures are HTML copied from the job boards; splitting them would falsify them.
"tests/test_sources.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/jobbot"]
# Third-party libraries that ship no types (bs4, playwright) must not fill the
# output with noise: what is checked here is our own code.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
