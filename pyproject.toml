[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-bot"
version = "0.1.0"
description = "Buscador de ofertas backend con alertas de Telegram y generacion de cover letters"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Solo hace falta para `jobbot login` y para la fuente Otta. El resto del bot
# funciona sin esto. Tras instalarlo: playwright install chromium
browser = ["playwright>=1.44"]

[project.scripts]
jobbot = "jobbot.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
# La misma anchura que ruff: dos formateadores con reglas distintas se
# reformatean el codigo el uno al otro en cada commit.
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declara las opciones en los valores por defecto: es su forma de uso.
"src/jobbot/cli.py" = ["B008"]
# Los fixtures son HTML copiado de los portales; partirlos los falsearia.
"tests/test_sources.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/jobbot"]
# Las librerias de terceros que no traen tipos (bs4, playwright) no deben
# llenar la salida de ruido: lo que se comprueba es el codigo propio.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
