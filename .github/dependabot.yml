version: 2

# One check per week. Minor and patch updates arrive together in a single PR,
# because reviewing them one by one is noise: if CI passes, they go in. Major
# bumps come separately on purpose, since those are the ones that break things
# and you have to read the changelog before merging them.

updates:
  - package-ecosystem: pip
    directory: "/"
    # Without this, Dependabot widens the range instead of raising it: the PRs
    # read "update the requirements to permit the latest version", which is not
    # a version update, so it assigns them no major/minor/patch type and the
    # group below never matches. With `increase` they become real version
    # bumps and the grouping works.
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    # The limit counts every open Dependabot PR, and while it is reached
    # nothing new is created, grouped pull requests included. With six stale
    # ones left over from before the grouping worked, there was no room.
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    labels: [dependencies]
    groups:
      # Everything that is not a major version bump, in a single PR.
      routine:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions expire too: an un-updated v4 eventually fails on its own when
  # GitHub retires that version from the runner.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
