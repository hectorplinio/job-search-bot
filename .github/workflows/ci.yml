name: CI

# The tests never touch the network: each adapter is tested against fixtures
# copied from the job board's real response. That is why this runs with no
# secrets, on any clean runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The minimum version pyproject declares, and the one used locally.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      # The recipes live in the Makefile so this is exactly what you run on
      # your own machine with `make check`.
      - name: Lint (ruff + flake8)
        run: make lint

      # Black is the formatter of record. `ruff format` is deliberately not
      # used: they disagree on multiline literals, and two formatters rewrite
      # each other's code.
      - name: Types (mypy)
        run: make types

      - name: Format (black)
        run: make format-check

      - name: Tests
        run: make test

  config:
    # The criteria files are the project's interface: if one stops loading, the
    # bot does not start. The example profile is validated too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make install
      - name: The criteria and the profiles load
        run: make config-check
