name: CI

# Los tests no tocan la red: cada adaptador se prueba contra fixtures copiados
# de la respuesta real del portal. Por eso esto corre sin secretos y en
# cualquier runner limpio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # La version minima que declara pyproject y la que uso en local.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          make install-dev

      # Las recetas viven en el Makefile para que esto sea exactamente lo
      # mismo que ejecutas en tu maquina con `make check`.
      - name: Lint (ruff + flake8)
        run: make lint

      # Black es el formateador de referencia. `ruff format` no se usa a
      # proposito: discrepan en los literales multilinea, y dos formateadores
      # se reescriben el codigo el uno al otro.
      - name: Formato (black)
        run: make format-check

      - name: Tests
        run: make test

  config:
    # Los ficheros de criterios son la interfaz del proyecto: si uno deja de
    # cargar, el bot no arranca. Se valida tambien el perfil de ejemplo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - name: Los criterios y los perfiles cargan
        run: make config-check
