name: CI

# Los tests no tocan la red: cada adaptador se prueba contra fixtures copiados
# de la respuesta real del portal. Por eso esto corre sin secretos y en
# cualquier runner limpio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # La version minima que declara pyproject y la que uso en local.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Lint (flake8)
        run: flake8 src tests

      # Black es el formateador de referencia. `ruff format` no esta aqui a
      # proposito: discrepan en los literales multilinea, y dos formateadores
      # se reescriben el codigo el uno al otro.
      - name: Formato (black)
        run: black --check src tests

      - name: Tests
        run: pytest -q

  config:
    # Los ficheros de criterios son la interfaz del proyecto: si uno deja de
    # cargar, el bot no arranca. Se valida tambien el perfil de ejemplo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Los criterios y los perfiles cargan
        run: |
          python - <<'PY'
          from jobbot.domain.criteria import Criteria
          from jobbot.domain.profile import CandidateProfile

          for ruta in ("config.yaml", "examples/frontend/config.yaml"):
              print(ruta, "->", len(Criteria.load(ruta).search.queries), "busquedas")
          for ruta in ("profile/cv.yaml", "examples/frontend/cv.yaml"):
              print(ruta, "->", CandidateProfile.load(ruta).name)
          PY
