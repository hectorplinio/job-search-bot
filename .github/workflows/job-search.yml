name: Search for jobs

# The cron is disabled on purpose. Two of the sources depend on the user's own
# machine: Otta needs the browser profile holding its session, which does not
# survive between runner executions, and InfoJobs blocks data-centre IPs. On
# top of that, with no secrets configured every trigger fails and fills your
# inbox with alerts.
#
# The bot schedules its own searches while it is running. What is left here is
# the manual trigger, useful for testing the scraping without a session.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Send nothing to Telegram"
        type: boolean
        default: false

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # -e . installs the package and makes the `jobbot` command available.
      - run: pip install -e .

      # The history lives in the runner cache: without this, every run would
      # start blank and send you the same postings again. `restore-keys`
      # recovers the most recent cache even when the exact key (with the run
      # number) does not exist yet.
      - name: Restore history
        uses: actions/cache/restore@v6
        with:
          path: data
          key: jobbot-history-${{ github.run_number }}
          restore-keys: |
            jobbot-history-

      - name: Search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOBBOT_LOG_LEVEL: INFO
        run: |
          jobbot run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: jobbot-history-${{ github.run_number }}
