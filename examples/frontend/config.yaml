# Example criteria for a frontend profile. It shows that everything defining
# "what counts as a good posting" lives in this file and in profile/cv.yaml.
#
#   JOBBOT_CONFIG_PATH=examples/frontend/config.yaml
#   JOBBOT_PROFILE_PATH=examples/frontend/cv.yaml
#   jobbot run --dry-run
#

search:
  # Each query is fired at every source that supports one.
  queries:
    - "frontend engineer react"
    - "react developer"
    - "typescript frontend"
    - "next.js developer"
    - "design system engineer"
  # Only applies to sources with a geographic filter (LinkedIn, Glassdoor).
  locations:
    - "Spain"
    - "European Union"
  # Cap per individual search.
  max_results_per_query: 25
  # Cap for the whole source, across all its searches. Only the one above used
  # to exist and it doubled as the total, so the first search used up the quota
  # and the rest contributed nothing.
  max_results_per_source: 40
  # Ignores postings published more than N days ago (when the source gives a date).
  max_age_days: 21
  # A per-source window. On a company's own board a two-month-old listing is
  # still open, because filled roles are taken down; but with no cap, year-old
  # ghost reqs slipped through.
  max_age_days_by_source:
    companies: 90

salary:
  currency: EUR
  # These two figures are an example. This file is published in the repo, and
  # your negotiating numbers should not be there: put them in .env as
  # JOBBOT_SALARY_MINIMUM and JOBBOT_SALARY_TARGET, which override these.
  #
  # The minimum is compared against the TOP of the band: a posting of
  # "35.000 - 53.000" still gets in, because it may pay above. Only the ones
  # that fall short even at their best are dropped.
  minimum: 30000
  # From here up, a posting scores full marks in the salary block.
  target: 45000
  # Many postings publish no salary. If false, every posting without one is
  # rejected (you will be left with very few).
  accept_unknown: true

work_mode:
  # Hybrid is out: you live far from a big city and commuting is not worth it.
  # "unknown" stays because many good postings do not declare a work mode; if
  # too much junk comes in that way, drop it too.
  accepted: [remote, unknown]
  rejected: [hybrid, onsite]

keywords:
  # A posting needs at least one of these to count as being in your field.
  required_any:
    - react
    - typescript
    - javascript
    - frontend
  # Weight of each technology in the scoring (0-10).
  weighted:
    react: 10
    typescript: 9
    javascript: 7
    next.js: 7
    remix: 5
    astro: 4
    "design system": 8
    storybook: 5
    tailwind: 5
    css: 4
    accessibility: 7
    accesibilidad: 7
    wcag: 6
    playwright: 5
    cypress: 4
    vitest: 4
    jest: 4
    graphql: 4
    "web performance": 6
    node.js: 4

exclude:
  # If the title contains any of these, the posting is dropped.
  titles:
    - junior
    - jr.
    - intern
    - internship
    - becario
    - practicas
    - prácticas
    - trainee
    - apprentice
    - "student"
    # Graduate and internship programmes: they ask for a recent university
    # degree and start a year later. They slipped through because the title
    # reads "Software Engineer (Python)" and the catch is in the prefix.
    - "graduate programme"
    - "graduate program"
    - "graduate scheme"
    - "new grad"
    - "new-grad"
    - "internship programme"
    - "internship program"
    - "working student"
  # If the body of the posting contains this, it is dropped.
  description:
    - "100% presencial"
    - "totalmente presencial"
    - "trabajo presencial obligatorio"
    - "no se admite teletrabajo"
    - "sin teletrabajo"
    # Remote, yes, but only inside the US. You cannot take these from Spain, so
    # better not to spend a single LLM call on them.
    - "usa only"
    - "us only"
    - "united states only"
    - "must be based in the united states"
    - "must reside in the united states"
    - "authorized to work in the us"
    - "authorized to work in the united states"
    - "us work authorization"
    - "must be located in the us"
  # Roles and stacks from another field. They only drop a posting when the
  # TITLE does not also name something from core_title_terms. Without this,
  # things like "Senior .NET Full-stack Developer" or "Senior React Native
  # Developer" slip in, scoring high because the description listed half an
  # ecosystem.
  off_profile_titles:
    - backend
    - back-end
    - devops
    - sre
    - "data scientist"
    - "data analyst"
    - "machine learning engineer"
    - qa
    - tester
    - "scrum master"
    - "product manager"
    - "product owner"
    - sap
    - salesforce
    - wordpress
    - php
    - java
    - ".net"
    - c#
    - android
    - ios
  # What rescues a title from the list above. It deliberately does NOT include
  # "full stack": a ".NET Full-stack" is still a .NET job.
  core_title_terms:
    - react
    - frontend
    - front-end
    - typescript
    - javascript
    - "ui engineer"
  # Applicant cap. Only LinkedIn publishes the number, so leaving it empty is
  # the sensible choice: a cap would penalise the sources that do not report
  # it. Put a number here (30, say) if you want the equivalent of LinkedIn's
  # "fewer than 10 applicants" filter.
  max_applicants: null
  # Veto technologies: they only drop a posting when it does NOT carry a modern
  # stack (Python or Node/TypeScript). A "PHP + Python" role survives.
  soft_veto_stack:
    - angularjs
    - jquery
    - wordpress
    - drupal
    - sharepoint

scoring:
  # Minimum score (1-10) for the bot to send you a posting.
  notify_threshold: 6
  # Re-score with Claude the postings that clear the rule-based threshold.
  # It costs money (a few cents per run), but it improves the score a lot and
  # writes the "why it fits" line you see in Telegram.
  use_llm: true
  # Only what already passed the rule filter and scored >= this goes to Claude.
  llm_min_rule_score: 5
  # How many postings Claude scores at most per run. They go in batches of 6
  # per call, so 40 postings are 7 calls, not 40.
  llm_max_offers_per_run: 40
  # LinkedIn publishes on the posting how many people have already applied.
  # Being among the first is what moves the odds of being read the most, so it
  # adds; a queue of 200 subtracts.
  competition:
    few_applicants: 25
    many_applicants: 150
    bonus: 8
    penalty: 8

sources:
  companies:
    # The most useful source: the companies' own job boards, read straight from
    # their Greenhouse or their Ashby. The posting shows up here before it does
    # on any aggregator, and it carries the real location, so you can tell
    # which is the Spanish version of a role published per country.
    #
    # To add a company, look at the URL of its careers page:
    #   job-boards.greenhouse.io/COMPANY  ->  ats: greenhouse
    #   jobs.ashbyhq.com/COMPANY          ->  ats: ashby
    enabled: true
    watchlist:
      # Checked: all three publish roles for Spain.
      - { name: "Grafana Labs", ats: greenhouse, slug: grafanalabs }
      - { name: "Affirm",       ats: greenhouse, slug: affirm }
      - { name: "Monzo",        ats: greenhouse, slug: monzo }
  manfred:
    enabled: true
  linkedin:
    enabled: true
    # 2 = remote, 3 = hybrid, 1 = on-site
    workplace_types: ["2", "3"]
    # "Easy Apply" only, the equivalent of LinkedIn's own filter. You apply
    # without leaving LinkedIn, but it leaves out many good postings that use
    # their own ATS. That is why it is off.
    easy_apply_only: false
  tecnoempleo:
    enabled: true
    # full or partial remote work only
    telework_only: true
    # Their search is by technology, not by phrase: two terms cover more than
    # six long phrases, and we hit them less.
    queries: ["react", "javascript", "typescript"]
  infojobs:
    enabled: true
    # InfoJobs blocks your IP if you chain too many searches in a row.
    # With two broad queries it holds up.
    queries: ["react", "frontend"]
  glassdoor:
    # Off out of the box: without a session it answers 403 after a few
    # requests. Put GLASSDOOR_COOKIE in .env, run `jobbot check-sources` and,
    # if it returns postings, switch this to true.
    enabled: false
  remoteok:
    enabled: true
  remotive:
    # Switched off after measuring it. Its free feed is 16 postings in total,
    # and the only ones that pass the filter are all from Lemon.io, which
    # already shows up through We Work Remotely. On top of that they charge to
    # apply from their site. Cost of leaving it on: one request. Value: zero.
    enabled: false
  himalayas:
    # Like Remotive, but its country restriction is an explicit list: the most
    # reliable field for knowing whether you can apply.
    enabled: true
    # 20 postings per page. Its catalogue is over 100,000, but nine out of ten
    # are United States only and get dropped on the fly, so you have to read a
    # fair few pages to get a handful of eligible ones.
    pages: 15
  weworkremotely:
    enabled: true
  otta:
    # Otta moved to Welcome to the Jungle. It sits behind AWS WAF with a
    # JavaScript challenge and its listing is also behind a sign-up, so copying
    # a cookie is no use: you have to go with a browser.
    #
    # Session started on 11/09/2026 with `jobbot login otta`, valid for a year.
    # If it ever stops returning postings, run that command again.
    enabled: true
    # Otta does not search by text: it shows you the "matches" it computes from
    # your preferences on their site, one at a time. That is why there are no
    # queries here. If the postings do not fit, the place to fix that is your
    # Otta profile.
    #
    # How many to walk per run. Each one is about 4 seconds of browser, so 20
    # take a minute and a half.
    max_jobs: 20

schedule:
  # The bot itself launches a search every X hours while it is listening. That
  # way no scheduled task and no cron are needed: a single process, and the
  # buttons on the alerts always work because the bot is alive.
  enabled: true
  every_hours: 4
  # A margin before the first search on startup, so it does not go searching
  # the very second you turn the computer on.
  first_run_after_minutes: 3

telegram:
  # How many postings it sends at most per run, best score first. With 50 you
  # get practically everything above the threshold. Do not remove it entirely:
  # it is the net that stops a bug from sending you 500 messages.
  max_alerts_per_run: 50
  # Seconds between one message and the next. Telegram drops sends that come
  # too close together in the same chat, so below 1 second they get lost.
  delay_between_messages: 1.2
